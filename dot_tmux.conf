##### ~/.tmux.conf #####

# --- 1. General Settings ---
set -g base-index 1              # Start window numbering at 1
set -g pane-base-index 1         # Start pane numbering at 1
set -g renumber-windows on       # Renumber windows when one is closed
set -g mouse on                  # Enable mouse support
set -gq focus-follows-mouse on   # Hover selects pane (tmux 3.7+; -q skips older)
set -g status off
set -g status-interval 5         # Refresh status line every 5 seconds
set -sg escape-time 10           # Reduce vi-mode lag in Helix
set -g focus-events on           # Forward focus events to apps (Helix autoread)
set -g history-limit 50000       # Bigger scrollback
set -g detach-on-destroy no-detached # Switch to another session when possible

# True Color Support (Fixes Helix themes)
set -g default-terminal "tmux-256color"
set -s terminal-features[90] "xterm-256color:RGB"
set -s terminal-features[91] "xterm-ghostty:RGB"

set -g set-titles on
set -g set-titles-string "#{host_short}:#S:#I #W"

# Clipboard + copy-mode keys
set -g set-clipboard on
set -g mode-keys vi
set -g status-keys vi
setw -g copy-mode-line-numbers hybrid
setw -g pane-scrollbars modal

# --- 1.1 Copy/Paste Fix (tmux buffer + system clipboard) ---
# vim-style v/y selection, copying to the system clipboard.
# set-clipboard sends OSC 52, so copies reach the local clipboard with no
# helper on either end -- including from a remote tmux over SSH.

bind-key b set -g status
# Prefix + [ enters copy-mode, Prefix + ] pastes the tmux buffer.
bind-key [ copy-mode
bind-key ] paste-buffer

# Vim-like selection inside copy-mode
bind-key -T copy-mode-vi v     send -X begin-selection
bind-key -T copy-mode-vi V     send -X select-line
bind-key -T copy-mode-vi C-v   send -X rectangle-toggle

# Copy to tmux buffer + system clipboard, then exit copy-mode
bind-key -T copy-mode-vi y     send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send -X copy-selection-and-cancel

# Drag-select in copy-mode: copy, exit, and push to the system clipboard.
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# --- 2. Key Bindings (Navigation & Management) ---

# Split panes using current directory
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Resize pane (Zoom)
bind-key z resize-pane -Z

# Reload config file easily (Prefix + r)
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# --- 4. Status Bar: Floating Bubbles (Green #86BE43) ---

# 1. Base Style: Transparent background for the "Floating" effect
set -g status-position bottom
set -g status-style bg=default,fg=white

# 2. Left Side: Session & Pane Index
set -g status-left-length 50
set -g status-left "#[bg=#86BE43,fg=#2C3E50,bold]  #S #[bg=#254215,fg=#86BE43,nobold] P#P "

# 3. Center: Window List
set -g status-justify centre
setw -g window-status-format "#[fg=gray] #I:#W "
setw -g window-status-current-format "#[bg=#86BE43,fg=black,bold] #I:#W "

# 4. Right Side: Directory & Time (Removed Command)
set -g status-right-length 100
set -g status-right "#[fg=#86BE43,bold]   #{=50:pane_current_path} #[fg=gray]"

# --- 5. Advanced: Environment ---
# Restore tmux defaults on reload, then add the terminal identity.
set -gu update-environment
set -g update-environment[99] TERM_PROGRAM
