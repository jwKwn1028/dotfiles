# General
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -gq focus-follows-mouse off  # Hover would undo keyboard pane switches
set -g status on
set -g status-interval 5
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g detach-on-destroy no-detached

set -g default-terminal "tmux-256color"
set -s terminal-features[90] "xterm-256color:RGB"
set -s terminal-features[91] "xterm-ghostty:RGB"

set -g set-titles on
set -g set-titles-string "#{host_short}:#S:#I #W"

# Clipboard (OSC 52) and copy mode
set -g set-clipboard on
set -g mode-keys vi
set -g status-keys vi
setw -g copy-mode-line-numbers hybrid
setw -g pane-scrollbars modal

bind-key b set status
bind-key [ copy-mode
bind-key ] paste-buffer -p

bind-key -T copy-mode-vi v     send -X begin-selection
bind-key -T copy-mode-vi V     send -X select-line
bind-key -T copy-mode-vi C-v   send -X rectangle-toggle

bind-key -T copy-mode-vi y     send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send -X copy-selection-and-cancel

bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# Local terminal integration
if-shell '[ -z "$SSH_CONNECTION" ]' {
  set -g allow-passthrough on
  set -g scroll-on-clear off
  set -s extended-keys on
  set -sq extended-keys-format csi-u
  set -sa terminal-features[90] ":extkeys:sync"
  set -sa terminal-features[91] ":extkeys:sync"
  set -g prefix None
  set -g prefix2 C-]
  bind -n C-b if -F '#{m/r:^(ssh|tmux)$,#{pane_current_command}}' { send-keys C-b } { switch-client -T prefix }
  bind C-b send-keys C-b
  # Cursor-form Home/End for fancy-cat.
  bind -n Home if -F '#{==:#{pane_current_command},fancy-cat}' { send-keys -l "\033[H" } { send-keys Home }
  bind -n End if -F '#{==:#{pane_current_command},fancy-cat}' { send-keys -l "\033[F" } { send-keys End }
  bind C-] send-prefix -2
  set-hook -g session-window-changed { if -F '#{window_active}' { if -F '#{P:#{?#{&&:#{==:#{pane_current_command},ssh},#{m/r:^[^:]+:[^:]+:[0-9]+ ,#{pane_title}}},1,}}' { set status off } { set status on } } }
  set-hook -g after-kill-pane { set-hook -R session-window-changed }
  set-hook -g pane-title-changed { set-hook -R session-window-changed }
  set-hook -g client-focus-in { run-shell -b 'ghostty-tmux-mode on --tmux-client #{client_pid} >/dev/null 2>&1 || true' }
  # Restore the shell's Helix mode on attach.
  set-hook -g client-attached { run-shell -b 'sleep 0.2; case "$(tmux show-environment -t "#{session_name}" ZHM_MODE)/$(tmux display -p -t "#{pane_id}" "##{pane_current_command}:##{cursor_shape}")" in *=insert/zsh:block|*=insert/zsh:underline) tmux send-keys -t "#{pane_id}" i;; *=normal/zsh:bar) tmux send-keys -t "#{pane_id}" Escape;; esac' }
  set-hook -g 'client-attached[1]' { run-shell -b 'ghostty-tmux-mode on --tmux-client #{client_pid} --on-attach >/dev/null 2>&1 || true' }
}

# Splits and navigation
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -a -c "#{pane_current_path}"

bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R
# Non-repeating pane keys for Ghostty.
bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R

bind -n M-H previous-window
bind -n M-L next-window
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
bind -n M-0 select-window -t :=10
# Debounce Ghostty wheel bursts.
set -gu @wheel_busy
bind -n WheelUpStatus { if -F '#{!:#{@wheel_busy}}' { set -g @wheel_busy 1; previous-window; run-shell -b -d 0.15 -C 'set -gu @wheel_busy' } }
bind -n WheelDownStatus { if -F '#{!:#{@wheel_busy}}' { set -g @wheel_busy 1; next-window; run-shell -b -d 0.15 -C 'set -gu @wheel_busy' } }

bind-key z resize-pane -Z

bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Status bar (green local, blue SSH)
set -g @bar_main '#86BE43'
set -g @bar_dim '#254215'
if-shell '[ -n "$SSH_CONNECTION" ]' {
  set -g @bar_main '#7AA2F7'
  set -g @bar_dim '#394B70'
}

set -g status-position bottom
set -g status-style bg=default,fg=white

set -g status-left-length 50
set -g status-left "#[bg=#{@bar_main},fg=#2C3E50,bold]  #S #[bg=#{@bar_dim},fg=#{@bar_main},nobold] #{host_short} "

set -g status-justify centre
setw -g automatic-rename-format '#{?#{==:#{pane_current_command},ssh},#{?#{m/r:^[^:]+:[^:]+:[0-9]+ ,#{pane_title}},#{s/^([A-Za-z0-9._-]+).([A-Za-z0-9_-]+).[0-9]+ .*/\2@\1/:pane_title},ssh},#{?#{m/r:^-?(zsh|bash|sh)$,#{pane_current_command}},#{?#{m/r:^/(home|Users)/[^/]+/?$,#{pane_current_path}},~,#{b:pane_current_path}},#{pane_current_command}}}'
setw -g window-status-format "#{?#{>:#{session_windows},1},#[fg=gray] #I:#W ,}"
setw -g window-status-current-format "#{?#{>:#{session_windows},1},#[bg=#{@bar_main}]#[fg=black]#[bold] #I:#W ,}"

set -g status-right-length 100
set -g status-right "#{?client_prefix,#[bg=#{@bar_main}]#[fg=#2C3E50]#[bold] PREFIX #[default] ,}#[fg=#{@bar_main},bold]   #{=/-50/…:pane_current_path} "

# Client environment
set -gu update-environment
set -g update-environment[98] ZHM_MODE
set -g update-environment[99] TERM_PROGRAM

# Session save and restore
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-hook-post-restore-all 'tmux set -s @resurrect-armed 1'
set -g @resurrect-hook-post-save-all 'tmux set -s @resurrect-armed 1; [ ! -x ~/.local/bin/tmux-resurrect-alt-screens ] || ~/.local/bin/tmux-resurrect-alt-screens'
set -g @resurrect-hook-post-save-layout '[ ! -x ~/.local/bin/tmux-resurrect-post-save ] || ~/.local/bin/tmux-resurrect-post-save'
set -g @resurrect-processes 'btop hx hpc hpcz micro fancy-cat fancy-cat-open taskwarrior-tui sysmon "yazi->y" "~^ssh [-A-Za-z0-9_.@:=/ ]+$"'
set-hook -g client-detached { run-shell -b '[ ! -x ~/.local/bin/tmux-resurrect-autosave ] || ~/.local/bin/tmux-resurrect-autosave' }
if-shell 'test -f ~/.tmux/plugins/tmux-resurrect/resurrect.tmux' 'run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux'
