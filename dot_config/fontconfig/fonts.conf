<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  JuliaMono leads because xsettings.xml already sets it as Gtk/FontName and
  Gtk/MonospaceFontName; this makes the generic aliases agree. NanumGothicCoding
  follows for Korean (JuliaMono has no Hangul), matching ghostty's fallback
  order. Inter was preferred here previously but is not in packages.toml, so it
  would be missing on a new machine.
-->
<fontconfig>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>JuliaMono</family>
      <family>NanumGothicCoding</family>
      <family>Noto Sans CJK KR</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <!-- Previously absent, so monospace fell through to DejaVu Sans Mono. -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JuliaMono</family>
      <family>NanumGothicCoding</family>
      <family>Noto Sans Mono CJK KR</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif CJK KR</family>
    </prefer>
  </alias>

</fontconfig>
