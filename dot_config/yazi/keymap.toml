[mgr]
prepend_keymap = [
	# Plugins, locked in package.toml
	{ on = "l",     run = "plugin smart-enter",             desc = "Enter the child directory, or open the file" },
	{ on = "p",     run = "plugin smart-paste",             desc = "Paste into the hovered directory or CWD" },
	{ on = "T",     run = "plugin toggle-pane max-preview", desc = "Maximize or restore the preview pane" },
	{ on = "<C-p>", run = "plugin toggle-pane min-preview", desc = "Show or hide the preview pane" },

	# Navigation
	{ on = "!",          run = 'shell "$SHELL" --block',                                                   desc = "Open $SHELL here", for = "unix" },
	{ on = [ "g", "w" ], run = "cd ~/Documents/Workspace",                                                 desc = "Go to Workspace" },
	{ on = [ "g", "p" ], run = "cd ~/Documents/Workspace/Project",                                         desc = "Go to Project" },
	{ on = [ "g", "r" ], run = 'shell -- root="$(git rev-parse --show-toplevel)" && ya emit cd "$root"', desc = "Go to the git root" },
	{ on = [ "g", "s" ], run = "plugin vcs-files",                                                         desc = "Show git changes" },

	# Clipboard
	{ on = "y",          run = [ '''shell -- python3 -c 'import pathlib, sys; print("\n".join(pathlib.Path(p).as_uri() for p in sys.argv[1:]))' %s | xclip -i -selection clipboard -t text/uri-list''', "yank" ], desc = "Yank, and copy as file URIs", for = "linux" },
	{ on = [ "c", "r" ], run = '''shell -- root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"; printf '%%s' "$(realpath --relative-to="$root" %s)" | clipcopy''', desc = "Copy path relative to the git root", for = "linux" },
	{ on = [ "c", "y" ], run = "shell -- clipcopy < %h",                                                  desc = "Copy file contents" },
	{ on = [ "c", "i" ], run = 'shell -- xclip -selection clipboard -t "$(file -b --mime-type %h)" -i %h', desc = "Copy image", for = "linux" },

	# Quick actions
	{ on = "C",     run = "shell '7z a .zip %s' --interactive --cursor=5",       desc = "Zip selected files" },
	{ on = "E",     run = "shell --orphan -- zed . && ya emit quit --code=10",    desc = "Open CWD in Zed and close the terminal" },
	{ on = "<C-t>", run = 'shell --orphan -- ghostty --working-directory="$PWD"', desc = "New Ghostty window here", for = "linux" },
	{ on = "W",     run = "shell --block -- taskwarrior-tui",                     desc = "Open taskwarrior-tui" },
]

[input]
prepend_keymap = [
	{ on = "<Esc>", run = "close", desc = "Cancel input" },
]
