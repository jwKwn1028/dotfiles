# WirePlumber 0.4 picks the default sink from a most-recently-used list in
# ~/.local/state/wireplumber/default-nodes. A sink that has never been chosen
# by hand loses to the laptop speaker, which sits in the middle of that list,
# so plugging in a new USB DAC leaves the volume keys on the speaker.
#
# module-switch-on-connect makes any newly appearing sink the default and
# moves running streams to it. Trade-off: HDMI audio on c4:00.1 counts as a
# new sink, so plugging in an external monitor also takes over playback.
pulse.cmd = [
    { cmd = "load-module" args = "module-switch-on-connect" }
]
