# ============================================================
# fuzzel — the Wayland counterpart of this repo's rofi launcher.
# dot_config/rofi/spotlight.rasi is the design reference: Tokyo
# Night, square corners, top-anchored at 15% of the screen, one
# 640px-wide column of eight icon rows, no prompt label.
# ============================================================

# spotlight.rasi: font "JuliaMono Regular 13", matching the Ghostty terminal.
font=JuliaMono:size=13

# `auto` would size the font from the panel's physical DPI (this laptop
# reports ~143), making the launcher noticeably larger than the X11 rofi it
# is copying. `no` sizes by the output scale factor instead, so 16 means the
# same 16 points rofi rendered at 96 dpi.
dpi-aware=no

# rofi's inputbar has children [ entry ] only -- no prompt label -- and the
# entry carries placeholder "Search".
prompt=""
placeholder=Search

icon-theme=Papirus
icons-enabled=yes

# rofi: drun-display-format "{name}", matching "fuzzy", sorting-method "fzf".
# fuzzel's fzf mode is the subsequence matcher; its "fuzzy" mode is
# Levenshtein, which is not what rofi was doing.
fields=name,generic,keywords
match-mode=fzf
sort-result=yes

# Matches ~/.config/noctalia/settings.json appLauncher.terminalCommand and
# the TERMINAL set in dot_config/niri/cfg/misc.kdl.
terminal=ghostty -e

# ─── Geometry ───────────────────────────────────────────────────────
# rofi: window { width: 640px; location: north; anchor: north;
#                y-offset: 15%; padding: 12px }
#       mainbox { spacing: 12px }  listview { lines: 8 }
#
# fuzzel sizes the window in *characters*, excluding border and padding.
# JuliaMono advances 0.600 em and fuzzel rounds the em to 17px at 13 pt /
# 96 dpi, so one character is 10.2 px:
#     2*1 border + 2*22 pad + 58 * 10.2  =  638 px
#
# y-margin is rofi's 15% y-offset resolved against this laptop's 1200px
# panel. fuzzel takes an absolute pixel offset, so it cannot track the
# screen height the way the percentage did.
anchor=top
y-margin=180
width=58
horizontal-pad=22
vertical-pad=12
inner-pad=12
lines=8

# One number sets both the row height and the icon size here, where rofi set
# element padding (8px), listview spacing (4px) and icon size (18px)
# separately. Note the unit: the pad options above are pixels, but
# line-height is points unless suffixed with "px", so 30 renders 40px rows.
# rofi's row is 8+8 padding around max(18px icon, 20.4px JuliaMono line box at
# 13 pt), plus 4px listview spacing: 40.4px.
line-height=30

# fuzzel blows the icon up to a preview when few entries match. rofi has no
# such behaviour; 1 turns it off.
image-size-ratio=1

layer=overlay

[colors]
# spotlight.rasi's Tokyo Night palette. fuzzel has no separate background
# for the input row, so rofi's inputbar tint (tn-bg-alt #24283b) has no
# counterpart -- the input sits directly on the window background.
background=292d3eff
text=c0caf5ff
input=c0caf5ff
prompt=565f89ff
placeholder=565f89ff
counter=565f89ff
match=7aa2f7ff
selection=283457ff
selection-text=c0caf5ff
selection-match=7aa2f7ff
border=292e42ff

[border]
# rofi: border 1px, border-radius 0.
width=1
radius=0
selection-radius=0
