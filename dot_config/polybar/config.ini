; One synchronized horizontal bar per active monitor. Horizontal only; see the
; note at the bottom.

[colors]
background = #00000000
foreground = #e0e0e0
primary    = #89b4fa
accent     = #f5c2e7
disabled   = #6c7086
alert      = #f38ba8
focusblock = #33ffffff
; Deliberately stronger than focusblock: the same wash spread across a module as
; wide as the clock is easy to miss.
selection  = #4dffffff

[bar/main]
monitor = ${env:MONITOR:eDP}
width   = 100%
height  = 28px
offset-x = 0
offset-y = 0
bottom = false
radius = 0
fixed-center = true
; One unit, matching every module's `format-padding`, so the outer inset reads
; the same as the gaps between.
padding-left  = 1
padding-right = 1
; Modules carry their own `format-padding` instead, so a selection block runs
; edge to edge. Dropping a module's padding closes it against its neighbour.
module-margin = 0
border-size = 0pt

background = ${colors.background}
foreground = ${colors.foreground}

; Icon fonts must be the *Mono* cut: proportional glyphs overflow their cell and
; polybar clips the overflow once anything paints a background behind them --
; which the cursor's selection block does. Two sizes because the volume ramp and
; the power icon are not drawn to a common optical size; modules pick with
; `-font = 2`/`3` (1-based). The number after `;` is a vertical offset in px, per
; size rather than per family, so each line is centred separately.
font-0 = "JuliaMono:style=Regular:size=11;2"
font-1 = "JetBrainsMono Nerd Font Mono:size=15;3"
font-2 = "JetBrainsMono Nerd Font Mono:size=18;4"

; Each `-sel` twin sits beside the module it stands in for, so swapping the two
; changes only the background, never the layout. See [module/date-sel].
modules-left   = i3
modules-center = date date-sel
modules-right  = cpu memory pulseaudio pulseaudio-sel battery battery-sel powermenu powermenu-sel

cursor-click = pointer
enable-ipc = true
wm-restack = i3

[bar/external]
inherit = bar/main

; launch.sh assigns this bar to the internal laptop panel, or the primary output
; on a machine without one. X11 permits only one tray owner.
[bar/tray]
inherit = bar/main
modules-right = cpu memory pulseaudio pulseaudio-sel battery battery-sel tray powermenu powermenu-sel

; --- modules ---

[module/i3]
type = internal/i3
pin-workspaces = false
show-urgent = true
index-sort = true
enable-click = true
enable-scroll = true
reverse-scroll = true

label-focused             = %index%
label-focused-background  = ${colors.focusblock}
label-focused-foreground  = ${colors.primary}
label-focused-padding     = 1
label-unfocused           = %index%
label-unfocused-padding   = 1
label-visible             = %index%
label-visible-foreground  = ${colors.disabled}
label-visible-padding     = 1
label-urgent              = %index%
label-urgent-foreground   = ${colors.alert}
label-urgent-padding      = 1

[module/date]
type = internal/date
interval = 1
date = %a %m %d
time = %H:%M
date-alt = %Y-%m-%d %a
time-alt = %H:%M:%S
label = %date%  %time%
; Padding on both halves of every navigable pair, so selecting one never shifts
; the bar.
format-padding = 1

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
; No ramp: the Mono cut squeezes every glyph to one cell width, so the wider
; source glyphs shrink vertically -- md-volume_low is 926 units tall, _medium
; 714, _high 584. The icon would visibly shrink as volume rose. The percentage
; beside it already says the same thing, so one static icon carries the state.
format-volume = <label-volume>
format-volume-prefix = "󰕾 "
format-volume-prefix-font = 2
format-volume-prefix-foreground = #ffffff
label-volume = %percentage%%
format-muted-prefix = "󰝟 "
format-muted-prefix-font = 2
format-muted-prefix-foreground = ${colors.disabled}
format-muted = <label-muted>
label-muted = "muted"
label-muted-foreground = ${colors.disabled}
interval = 1
format-volume-padding = 1
format-muted-padding = 1
click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle
click-right = pavucontrol

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99
low-at  = 15
format-charging    = %{A1:xfce4-power-manager-settings:}%{A4:/usr/bin/brightnessctl -q set +5%:}%{A5:/usr/bin/brightnessctl -q set 5%-:}<label-charging>%{A}%{A}%{A}
format-discharging = %{A1:xfce4-power-manager-settings:}%{A4:/usr/bin/brightnessctl -q set +5%:}%{A5:/usr/bin/brightnessctl -q set 5%-:}<label-discharging>%{A}%{A}%{A}
format-full        = %{A1:xfce4-power-manager-settings:}%{A4:/usr/bin/brightnessctl -q set +5%:}%{A5:/usr/bin/brightnessctl -q set 5%-:}<label-full>%{A}%{A}%{A}
format-low         = %{A1:xfce4-power-manager-settings:}%{A4:/usr/bin/brightnessctl -q set +5%:}%{A5:/usr/bin/brightnessctl -q set 5%-:}<label-low>%{A}%{A}%{A}
label-charging    = "CHG %percentage%%"
label-charging-foreground = ${colors.primary}
label-discharging = "BAT %percentage%%"
label-full        = "FULL"
label-full-foreground = ${colors.disabled}
label-low         = "low %percentage%%"
label-low-foreground = ${colors.alert}
format-charging-padding    = 1
format-discharging-padding = 1
format-full-padding        = 1
format-low-padding         = 1

[module/cpu]
; custom/script, not internal/cpu, to share ~/.local/bin/cpu-load with the zsh
; `sysmon` monitor. Its second argument must mirror `interval`: one process runs
; per monitor and each has to measure over a full interval.
type = custom/script
exec = $HOME/.local/bin/cpu-load polybar 2
interval = 2
format = <label>
format-padding = 1
label = CPU %output%%

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-padding = 1
label = RAM %percentage_used%%

[module/tray]
type = internal/tray
tray-size = 70%
; Bar mode's block is exactly the icon's column, so a gap would split
; neighbouring blocks apart. The padding is the group's outer inset only.
tray-spacing = 0px
format-padding = 1

[module/powermenu]
type = custom/menu
expand-right = false
format-spacing = 1
format-padding = 1

label-open = ""
label-open-font = 3
label-open-foreground = ${colors.alert}
label-close = ""
label-close-font = 3
label-close-foreground = ${colors.disabled}
label-separator = " "
label-separator-foreground = ${colors.disabled}

menu-0-0 = ""
menu-0-0-font = 3
menu-0-0-foreground = ${colors.alert}
menu-0-0-exec = $HOME/.config/polybar/scripts/confirm-poweroff.sh
menu-0-1 = ""
menu-0-1-font = 3
menu-0-1-foreground = ${colors.accent}
menu-0-1-exec = systemctl reboot
menu-0-2 = ""
menu-0-2-font = 3
menu-0-2-foreground = ${colors.primary}
menu-0-2-exec = i3lock
menu-0-3 = ""
menu-0-3-font = 3
menu-0-3-foreground = ${colors.disabled}
menu-0-3-exec = menu-open-1

; Confirmation submenu for "exit i3"
menu-1-0 = "cancel"
menu-1-0-foreground = ${colors.disabled}
menu-1-0-exec = menu-open-0
menu-1-1 = "exit i3"
menu-1-1-foreground = ${colors.alert}
menu-1-1-exec = i3-msg exit

; --- keyboard-cursor twins ---
; A module's colors are fixed once the bar starts, so the cursor (Super+I, from
; ~/.config/i3/bar-nav.sh) swaps in a hidden twin over IPC. The tray gets none;
; bar-nav.sh paints its block instead.

[module/date-sel]
inherit = module/date
format-background              = ${colors.selection}
hidden = true

[module/pulseaudio-sel]
inherit = module/pulseaudio
format-volume-background       = ${colors.selection}
format-muted-background        = ${colors.selection}
hidden = true

[module/battery-sel]
inherit = module/battery
format-charging-background     = ${colors.selection}
format-discharging-background  = ${colors.selection}
format-full-background         = ${colors.selection}
format-low-background          = ${colors.selection}
hidden = true

[module/powermenu-sel]
inherit = module/powermenu
format-background              = ${colors.selection}
hidden = true

[settings]
screenchange-reload = true
pseudo-transparency = false

; Vertical: polybar 3.7 cannot stack modules inside one bar, and multi-bar
; attempts auto-stack and ignore offset-y even with override-redirect. eww is
; the tool for a vertical strip.
