; One synchronized horizontal bar per active monitor; see the note at the bottom.

[colors]
background = #00000000
foreground = #e0e0e0
primary    = #89b4fa
accent     = #f5c2e7
disabled   = #6c7086
alert      = #f38ba8
focusblock = #33ffffff
; Stronger than focusblock: the same wash over a clock-wide module is easy to miss.
selection  = #4dffffff

[bar/main]
monitor = ${env:MONITOR:eDP}
width   = 100%
height  = 28px
offset-x = 0
offset-y = 0
bottom = false
radius = 0
fixed-center = true
; One unit, matching every module's `format-padding`.
padding-left  = 1
padding-right = 1
; Modules carry their own `format-padding` so a selection block runs edge to edge.
module-margin = 0
border-size = 0pt

background = ${colors.background}
foreground = ${colors.foreground}

; Icon fonts must be the *Mono* cut; proportional glyphs get clipped behind a
; background. Modules pick with `-font = 2`/`3` (1-based); `;N` is a px offset.
font-0 = "JuliaMono:style=Regular:size=11;2"
font-1 = "JetBrainsMono Nerd Font Mono:size=15;3"
font-2 = "JetBrainsMono Nerd Font Mono:size=18;4"

; Each `-sel` twin sits beside its module, so swapping changes only the background.
modules-left   = i3
modules-center = date date-sel
modules-right  = cpu memory pulseaudio pulseaudio-sel battery battery-sel powermenu powermenu-sel

cursor-click = pointer
enable-ipc = true
; No wm-restack: it needs override-redirect. polybar_raise() does the raising.

[bar/external]
inherit = bar/main

; launch.sh assigns this to the internal panel, or primary. One tray owner only.
[bar/tray]
inherit = bar/main
modules-right = cpu memory pulseaudio pulseaudio-sel battery battery-sel tray powermenu powermenu-sel

; --- modules ---

[module/i3]
type = internal/i3
pin-workspaces = false
show-urgent = true
index-sort = true
enable-click = true
enable-scroll = true
reverse-scroll = true

label-focused             = %index%
label-focused-background  = ${colors.focusblock}
label-focused-foreground  = ${colors.primary}
label-focused-padding     = 1
label-unfocused           = %index%
label-unfocused-padding   = 1
label-visible             = %index%
label-visible-foreground  = ${colors.disabled}
label-visible-padding     = 1
label-urgent              = %index%
label-urgent-foreground   = ${colors.alert}
label-urgent-padding      = 1
label-mode-padding        = 1

[module/date]
type = internal/date
interval = 1
date = %a %m %d
time = %H:%M
date-alt = %Y-%m-%d %a
time-alt = %H:%M:%S
label = %{A3:thunderbird -mail:}%date%  %time%%{A}
; Padding on both halves of a navigable pair, so selecting one never shifts the bar.
format-padding = 1

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
; No ramp: the Mono cut shrinks taller glyphs, so the icon would shrink as volume
; rose. The percentage beside it already says the same thing.
format-volume = <label-volume>
format-volume-prefix = "󰕾 "
format-volume-prefix-font = 2
format-volume-prefix-foreground = #ffffff
label-volume = %percentage%%
format-muted-prefix = "󰝟 "
format-muted-prefix-font = 2
format-muted-prefix-foreground = ${colors.disabled}
format-muted = <label-muted>
label-muted = "muted"
label-muted-foreground = ${colors.disabled}
; Scroll step in percent, not a poll interval. 1 matches bar-nav.sh's j/k.
interval = 1
format-volume-padding = 1
format-muted-padding = 1
click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle
click-right = pavucontrol

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99
low-at  = 15
format-charging    = %{A1:xfce4-power-manager-settings:}%{A4:/usr/bin/brightnessctl -q set +5%:}%{A5:/usr/bin/brightnessctl -q set 5%-:}<label-charging>%{A}%{A}%{A}
format-discharging = %{A1:xfce4-power-manager-settings:}%{A4:/usr/bin/brightnessctl -q set +5%:}%{A5:/usr/bin/brightnessctl -q set 5%-:}<label-discharging>%{A}%{A}%{A}
format-full        = %{A1:xfce4-power-manager-settings:}%{A4:/usr/bin/brightnessctl -q set +5%:}%{A5:/usr/bin/brightnessctl -q set 5%-:}<label-full>%{A}%{A}%{A}
format-low         = %{A1:xfce4-power-manager-settings:}%{A4:/usr/bin/brightnessctl -q set +5%:}%{A5:/usr/bin/brightnessctl -q set 5%-:}<label-low>%{A}%{A}%{A}
label-charging    = "CHG %percentage%%"
label-charging-foreground = ${colors.primary}
label-discharging = "BAT %percentage%%"
label-full        = "FULL"
label-full-foreground = ${colors.disabled}
label-low         = "low %percentage%%"
label-low-foreground = ${colors.alert}
format-charging-padding    = 1
format-discharging-padding = 1
format-full-padding        = 1
format-low-padding         = 1

[module/cpu]
; custom/script, not internal/cpu, to share ~/.local/bin/cpu-load with zsh's
; `sysmon`. Its second argument must mirror `interval`.
type = custom/script
exec = $HOME/.local/bin/cpu-load polybar 2
interval = 2
format = <label>
format-padding = 1
label = CPU %output%%

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-padding = 1
label = RAM %percentage_used%%

[module/tray]
type = internal/tray
tray-size = 70%
; Bar mode's block is exactly the icon's column; a gap would split neighbours.
tray-spacing = 0px
format-padding = 1

[module/powermenu]
type = custom/menu
expand-right = false
format-spacing = 1
format-padding = 1

label-open = ""
label-open-font = 3
label-open-foreground = ${colors.alert}
label-close = ""
label-close-font = 3
label-close-foreground = ${colors.disabled}
label-separator = " "
label-separator-foreground = ${colors.disabled}

menu-0-0 = ""
menu-0-0-font = 3
menu-0-0-foreground = ${colors.alert}
menu-0-0-exec = $HOME/.config/polybar/scripts/confirm-poweroff.sh poweroff
menu-0-1 = ""
menu-0-1-font = 3
menu-0-1-foreground = ${colors.accent}
menu-0-1-exec = $HOME/.config/polybar/scripts/confirm-poweroff.sh reboot
menu-0-2 = ""
menu-0-2-font = 3
menu-0-2-foreground = ${colors.primary}
menu-0-2-exec = xflock4
menu-0-3 = ""
menu-0-3-font = 3
menu-0-3-foreground = ${colors.disabled}
menu-0-3-exec = #powermenu.open.1

; Confirmation submenu for "exit i3"
menu-1-0 = "cancel"
menu-1-0-foreground = ${colors.disabled}
menu-1-0-exec = #powermenu.open.0
menu-1-1 = "exit i3"
menu-1-1-foreground = ${colors.alert}
menu-1-1-exec = i3-msg exit

; --- keyboard-cursor twins ---
; Colors are fixed once the bar starts, so the cursor (Super+B, bar-nav.sh) swaps
; in a hidden twin over IPC. The tray gets none; bar-nav.sh paints its block.

[module/date-sel]
inherit = module/date
format-background              = ${colors.selection}
hidden = true

[module/pulseaudio-sel]
inherit = module/pulseaudio
format-volume-background       = ${colors.selection}
format-muted-background        = ${colors.selection}
hidden = true

[module/battery-sel]
inherit = module/battery
format-charging-background     = ${colors.selection}
format-discharging-background  = ${colors.selection}
format-full-background         = ${colors.selection}
format-low-background          = ${colors.selection}
hidden = true

[module/powermenu-sel]
inherit = module/powermenu
format-background              = ${colors.selection}
hidden = true

[settings]
; Off: a self-reload unhides the bar and still leaves a new output barless.
; randr-hotplug.sh drives display-setup.sh instead.
screenchange-reload = false
pseudo-transparency = false

; Vertical: polybar 3.7 cannot stack modules in one bar. Use eww instead.
