; One synchronized horizontal bar per active monitor. Vertical orientation is
; not well supported; see the notes at the bottom.

[colors]
; Fully transparent; the bar shows the wallpaper through it.
background = #00000000
foreground = #e0e0e0
primary    = #89b4fa
accent     = #f5c2e7
disabled   = #6c7086
alert      = #f38ba8
; Block behind the focused workspace.
focusblock = #33ffffff
; Block behind the module under the keyboard cursor. Stronger than focusblock:
; the same wash spread across a module as wide as the clock is easy to miss.
selection  = #4dffffff

[bar/main]
monitor = ${env:MONITOR:eDP}
width   = 100%
height  = 28px
offset-x = 0
offset-y = 0
bottom = false
radius = 0
fixed-center = true
; Near flush to both screen edges: one unit, matching the `format-padding` every
; module carries, so the first and last inset reads the same as the gaps between.
padding-left  = 1
padding-right = 1
; No gap between modules: every module carries its own `format-padding` instead,
; so the bar reads as one strip of cells and a selection block runs edge to edge
; like the tray icons' do. Removing a module's padding here closes it up against
; its neighbour's text.
module-margin = 0
border-size = 0pt

background = ${colors.background}
foreground = ${colors.foreground}

; JuliaMono matches the Ghostty terminal font; 11 leaves headroom in the 28px
; bar. The icon fonts must be the *Mono* cut: in the proportional cut glyphs
; overflow their cell, which only shows once something paints a background
; behind them, and polybar then clips the overflow away -- exactly what the
; keyboard cursor's selection block does.
; Two icon sizes because the glyphs are not drawn to a common optical size: the
; volume ramp and power icon need different cuts. Modules pick with `-font = 2`
; (font-1) or `-font = 3` (font-2); the index is 1-based.
; The number after `;` is a vertical offset in pixels, positive downwards, and
; is per size rather than per family: the same face at 18pt sits higher in the
; 28px bar than at 15pt. font-2's 4 puts the power glyph 6px from the top and
; 7px from the bottom, which is as centred as a 15px glyph gets in 28.
font-0 = "JuliaMono:style=Regular:size=11;2"
font-1 = "JetBrainsMono Nerd Font Mono:size=15;3"
font-2 = "JetBrainsMono Nerd Font Mono:size=18;4"

; Each `-sel` twin sits beside the module it stands in for, so swapping the two
; changes only the background, never the layout. The tray has no twin: its
; icons are XEmbed windows the bar cannot restyle, so bar-nav.sh parks the X
; pointer on them instead. See [module/date-sel].
modules-left   = i3
modules-center = date date-sel
modules-right  = cpu memory pulseaudio pulseaudio-sel battery battery-sel powermenu powermenu-sel

cursor-click = pointer
enable-ipc = true
wm-restack = i3

[bar/external]
inherit = bar/main

; launch.sh assigns this bar to the internal laptop panel, or the primary output
; on a machine without one. X11 permits only one tray owner.
[bar/tray]
inherit = bar/main
modules-right = cpu memory pulseaudio pulseaudio-sel battery battery-sel tray powermenu powermenu-sel

; ============================================================
; MODULES
; ============================================================

[module/i3]
type = internal/i3
pin-workspaces = false
show-urgent = true
index-sort = true
enable-click = true
enable-scroll = true
reverse-scroll = true

label-focused             = %index%
label-focused-background  = ${colors.focusblock}
label-focused-foreground  = ${colors.primary}
label-focused-padding     = 1
label-unfocused           = %index%
label-unfocused-padding   = 1
label-visible             = %index%
label-visible-foreground  = ${colors.disabled}
label-visible-padding     = 1
label-urgent              = %index%
label-urgent-foreground   = ${colors.alert}
label-urgent-padding      = 1

[module/date]
type = internal/date
interval = 1
date = %a %m %d
time = %H:%M
; No tooltips in polybar, so no hover calendar; click toggles the full date.
date-alt = %Y-%m-%d %a
time-alt = %H:%M:%S
label = %date%  %time%
; Padding lives on both halves of the pair, not just the twin, so selecting a
; module never shifts the bar. Same for the other navigable modules.
format-padding = 1

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-font = 2
ramp-volume-foreground = #ffffff
format-muted-prefix = "󰝟 "
format-muted-prefix-font = 2
format-muted-prefix-foreground = ${colors.disabled}
format-muted = <label-muted>
label-muted = "muted"
label-muted-foreground = ${colors.disabled}
interval = 1
format-volume-padding = 1
format-muted-padding = 1
click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle
click-right = pavucontrol

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99
low-at  = 15
format-charging    = %{A1:xfce4-power-manager-settings:}%{A4:/usr/bin/brightnessctl -q set +5%:}%{A5:/usr/bin/brightnessctl -q set 5%-:}<label-charging>%{A}%{A}%{A}
format-discharging = %{A1:xfce4-power-manager-settings:}%{A4:/usr/bin/brightnessctl -q set +5%:}%{A5:/usr/bin/brightnessctl -q set 5%-:}<label-discharging>%{A}%{A}%{A}
format-full        = %{A1:xfce4-power-manager-settings:}%{A4:/usr/bin/brightnessctl -q set +5%:}%{A5:/usr/bin/brightnessctl -q set 5%-:}<label-full>%{A}%{A}%{A}
format-low         = %{A1:xfce4-power-manager-settings:}%{A4:/usr/bin/brightnessctl -q set +5%:}%{A5:/usr/bin/brightnessctl -q set 5%-:}<label-low>%{A}%{A}%{A}
label-charging    = "CHG %percentage%%"
label-charging-foreground = ${colors.primary}
label-discharging = "BAT %percentage%%"
label-full        = "FULL"
label-full-foreground = ${colors.disabled}
label-low         = "low %percentage%%"
label-low-foreground = ${colors.alert}
format-charging-padding    = 1
format-discharging-padding = 1
format-full-padding        = 1
format-low-padding         = 1

[module/cpu]
; custom/script (not internal/cpu) to share the load calculation with the zsh
; `sysmon` monitor -- see ~/.local/bin/cpu-load, which counts iowait as idle.
; The second argument mirrors `interval`: one process runs per monitor, and they
; must each measure over a full interval rather than over the gap between them.
type = custom/script
exec = $HOME/.local/bin/cpu-load polybar 2
interval = 2
format = <label>
format-padding = 1
label = CPU %output%%

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-padding = 1
label = RAM %percentage_used%%

[module/tray]
type = internal/tray
tray-size = 70%
; No spacing between icons: bar mode's block is exactly the icon's column (see
; bar-nav.sh), so a gap there would split neighbouring blocks apart. The padding
; is the group's outer inset only, matching every other module -- it falls
; outside the first and last block rather than between any two.
tray-spacing = 0px
format-padding = 1

[module/powermenu]
type = custom/menu
expand-right = false
format-spacing = 1
format-padding = 1

label-open = ""
label-open-font = 3
label-open-foreground = ${colors.alert}
label-close = ""
label-close-font = 3
label-close-foreground = ${colors.disabled}
label-separator = " "
label-separator-foreground = ${colors.disabled}

menu-0-0 = ""
menu-0-0-font = 3
menu-0-0-foreground = ${colors.alert}
menu-0-0-exec = $HOME/.config/polybar/scripts/confirm-poweroff.sh
menu-0-1 = ""
menu-0-1-font = 3
menu-0-1-foreground = ${colors.accent}
menu-0-1-exec = systemctl reboot
menu-0-2 = ""
menu-0-2-font = 3
menu-0-2-foreground = ${colors.primary}
menu-0-2-exec = i3lock
menu-0-3 = ""
menu-0-3-font = 3
menu-0-3-foreground = ${colors.disabled}
menu-0-3-exec = menu-open-1

; Confirmation submenu for "exit i3"
menu-1-0 = "cancel"
menu-1-0-foreground = ${colors.disabled}
menu-1-0-exec = menu-open-0
menu-1-1 = "exit i3"
menu-1-1-foreground = ${colors.alert}
menu-1-1-exec = i3-msg exit

; ============================================================
; KEYBOARD-CURSOR TWINS
;
; A module's colors are fixed once the bar starts, so the cursor (Super+I, from
; ~/.config/i3/bar-nav.sh) cannot restyle one. Regular modules have a hidden
; highlighted twin swapped in with IPC. The tray has none: see bar-nav.sh.
; ============================================================

[module/date-sel]
inherit = module/date
format-background              = ${colors.selection}
hidden = true

[module/pulseaudio-sel]
inherit = module/pulseaudio
format-volume-background       = ${colors.selection}
format-muted-background        = ${colors.selection}
hidden = true

[module/battery-sel]
inherit = module/battery
format-charging-background     = ${colors.selection}
format-discharging-background  = ${colors.selection}
format-full-background         = ${colors.selection}
format-low-background          = ${colors.selection}
hidden = true

[module/powermenu-sel]
inherit = module/powermenu
format-background              = ${colors.selection}
hidden = true

[settings]
screenchange-reload = true
pseudo-transparency = false

; ============================================================
; Notes on vertical:
; Polybar (3.7) cannot stack modules vertically inside one bar.
; Multi-bar attempts auto-stack and don't honor offset-y reliably
; even with override-redirect=true. For a true XFCE-deskbar-like
; vertical strip on the right edge, eww is the recommended tool.
; ============================================================
