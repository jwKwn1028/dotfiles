; ============================================================
; Polybar — one synchronized horizontal bar per active monitor,
; transparent and styled after the XFCE panel. Vertical
; orientation isn't well supported; see notes at the bottom.
; ============================================================

[colors]
; XFCE panel background was solid #dedddb. Inverted to dark with
; ~70% alpha for transparency over wallpaper.
background = #00000000
foreground = #e0e0e0
primary    = #89b4fa
accent     = #f5c2e7
disabled   = #6c7086
alert      = #f38ba8
; Block behind the focused workspace, reused by the keyboard cursor so both
; kinds of "you are here" look the same.
selection  = #33ffffff

[bar/main]
monitor = ${env:MONITOR:eDP}
width   = 100%
height  = 28px
offset-x = 0
offset-y = 0
bottom = false
radius = 0
fixed-center = true
padding-left  = 3
padding-right = 3
module-margin = 1
border-size = 0pt

background = ${colors.background}
foreground = ${colors.foreground}

; JuliaMono matches the Ghostty terminal font. The 11 here is not the 11 the
; New Computer Modern Sans line used -- same number, different font, and
; JuliaMono is the larger of the two on the body. It is sized against font-1:
; the Nerd Font glyphs at 14 pt occupy 24.6px and with their ;3 offset already
; fill this 28px bar, so cap-matching the old text (which gave 10) read small
; beside them.
; Ceiling for reference: JuliaMono's clip bound is 1.425em, so 14 (26.6px) is
; the largest that fits at all and 13 the largest that still clears the ;2
; offset. 11 leaves headroom on both.
; font-1 stays a Nerd Font: JuliaMono carries none of the icon glyphs the
; volume ramp and power menu draw from it.
font-0 = "JuliaMono:style=Regular:size=11;2"
font-1 = "JetBrainsMono Nerd Font:size=14;3"

; The `-sel` twins are the keyboard cursor (see [module/date-sel]). Each sits
; immediately beside the module it stands in for, so swapping the two changes
; only the background, never the layout.
modules-left   = i3
modules-center = date date-sel
; No wlan module: nm-applet sits in the tray, shows the same signal strength,
; and unlike a polybar module opens the connection menu on click.
modules-right  = cpu memory pulseaudio pulseaudio-sel battery battery-sel tray powermenu powermenu-sel

cursor-click = pointer
enable-ipc = true
wm-restack = i3

[bar/external]
; Transcribed from bar/main. X11 supports only one system-tray owner, so the
; primary bar keeps `tray` while otherwise-identical external bars omit it.
inherit = bar/main
modules-right = cpu memory pulseaudio pulseaudio-sel battery battery-sel powermenu powermenu-sel

; ============================================================
; MODULES
; ============================================================

[module/i3]
type = internal/i3
pin-workspaces = false
show-urgent = true
index-sort = true
enable-click = true
enable-scroll = true
reverse-scroll = true

label-focused             = %index%
label-focused-background  = ${colors.selection}
label-focused-foreground  = ${colors.primary}
label-focused-padding     = 1
label-unfocused           = %index%
label-unfocused-padding   = 1
label-visible             = %index%
label-visible-foreground  = ${colors.disabled}
label-visible-padding     = 1
label-urgent              = %index%
label-urgent-foreground   = ${colors.alert}
label-urgent-padding      = 1

[module/date]
type = internal/date
interval = 5
date = %a %m %d
time = %H:%M
; Polybar has no tooltips, so the calendar waybar shows on hover is not
; reproducible. Click toggles to the full date instead.
date-alt = %Y-%m-%d %a
time-alt = %H:%M:%S
label = %date%  %time%
; Padding here rather than on the -sel twin only: it gives the cursor block the
; shape the focused workspace label gets from label-focused-padding, and putting
; it on both halves of the pair keeps them the same width, so selecting a module
; never shifts the bar. Same reason for the other three navigable modules.
format-padding = 1

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-font = 2
ramp-volume-foreground = #ffffff
format-muted-prefix = "󰝟 "
format-muted-prefix-font = 2
format-muted-prefix-foreground = ${colors.disabled}
format-muted = <label-muted>
label-muted = "muted"
label-muted-foreground = ${colors.disabled}
interval = 1
format-volume-padding = 1
format-muted-padding = 1
click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle
click-right = pavucontrol

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99
low-at  = 15
format-charging    = %{A1:xfce4-power-manager-settings:}%{A4:/usr/bin/brightnessctl -q set +5%:}%{A5:/usr/bin/brightnessctl -q set 5%-:}<label-charging>%{A}%{A}%{A}
format-discharging = %{A1:xfce4-power-manager-settings:}%{A4:/usr/bin/brightnessctl -q set +5%:}%{A5:/usr/bin/brightnessctl -q set 5%-:}<label-discharging>%{A}%{A}%{A}
format-full        = %{A1:xfce4-power-manager-settings:}%{A4:/usr/bin/brightnessctl -q set +5%:}%{A5:/usr/bin/brightnessctl -q set 5%-:}<label-full>%{A}%{A}%{A}
format-low         = %{A1:xfce4-power-manager-settings:}%{A4:/usr/bin/brightnessctl -q set +5%:}%{A5:/usr/bin/brightnessctl -q set 5%-:}<label-low>%{A}%{A}%{A}
label-charging    = "CHG %percentage%%"
label-charging-foreground = ${colors.primary}
label-discharging = "BAT %percentage%%"
label-full        = "FULL"
label-full-foreground = ${colors.disabled}
label-low         = "low %percentage%%"
label-low-foreground = ${colors.alert}
format-charging-padding    = 1
format-discharging-padding = 1
format-full-padding        = 1
format-low-padding         = 1

[module/cpu]
; custom/script (not internal/cpu) so it shares the exact load calculation with
; the zsh `sysmon` monitor — see ~/.local/bin/cpu-load. Unlike internal/cpu, this
; counts iowait as idle (the top/htop convention), not as load.
; The second argument is `interval` below. One bar per monitor runs this module,
; and cpu-load needs the poll rate to keep those processes from measuring over
; the gap between each other instead of over a full interval.
type = custom/script
exec = $HOME/.local/bin/cpu-load polybar 2
interval = 2
format = <label>
label = CPU %output%%

[module/memory]
type = internal/memory
interval = 2
format = <label>
label = RAM %percentage_used%%

[module/tray]
type = internal/tray
tray-padding = 2px
tray-size = 18px

[module/powermenu]
type = custom/menu
expand-right = false
format-spacing = 1
format-padding = 1

label-open = ""
label-open-font = 2
label-open-foreground = ${colors.alert}
label-close = ""
label-close-font = 2
label-close-foreground = ${colors.disabled}
label-separator = " "
label-separator-foreground = ${colors.disabled}

menu-0-0 = ""
menu-0-0-font = 2
menu-0-0-foreground = ${colors.alert}
menu-0-0-exec = $HOME/.config/polybar/scripts/confirm-poweroff.sh
menu-0-1 = ""
menu-0-1-font = 2
menu-0-1-foreground = ${colors.accent}
menu-0-1-exec = systemctl reboot
menu-0-2 = ""
menu-0-2-font = 2
menu-0-2-foreground = ${colors.primary}
menu-0-2-exec = i3lock
menu-0-3 = ""
menu-0-3-font = 2
menu-0-3-foreground = ${colors.disabled}
menu-0-3-exec = menu-open-1

; Confirmation submenu for "exit i3"
menu-1-0 = "cancel"
menu-1-0-foreground = ${colors.disabled}
menu-1-0-exec = menu-open-0
menu-1-1 = "exit i3"
menu-1-1-foreground = ${colors.alert}
menu-1-1-exec = i3-msg exit

; ============================================================
; KEYBOARD-CURSOR TWINS
;
; Polybar's window is an X11 dock and never takes keyboard focus, and a module's
; colors are fixed once the bar starts. So the cursor (Super+I, driven by
; ~/.config/i3/bar-nav.sh) does not restyle a module: every navigable module has
; a twin that inherits it and differs only by the selection background. The twin
; starts hidden and is swapped in with the module_show/module_hide IPC actions,
; which is why each one sits directly beside its original in the module lists.
;
; Only the background differs. The padding that gives the block its shape lives
; on the originals, so both halves of a pair are the same width and selecting a
; module never shifts the bar sideways.
; ============================================================

[module/date-sel]
inherit = module/date
format-background = ${colors.selection}
hidden = true

[module/pulseaudio-sel]
inherit = module/pulseaudio
format-volume-background = ${colors.selection}
format-muted-background  = ${colors.selection}
hidden = true

[module/battery-sel]
inherit = module/battery
format-charging-background    = ${colors.selection}
format-discharging-background = ${colors.selection}
format-full-background        = ${colors.selection}
format-low-background         = ${colors.selection}
hidden = true

[module/powermenu-sel]
inherit = module/powermenu
format-background = ${colors.selection}
hidden = true

[settings]
screenchange-reload = true
pseudo-transparency = false

; ============================================================
; Notes on vertical:
; Polybar (3.7) cannot stack modules vertically inside one bar.
; Multi-bar attempts auto-stack and don't honor offset-y reliably
; even with override-redirect=true. For a true XFCE-deskbar-like
; vertical strip on the right edge, eww is the recommended tool.
; ============================================================
