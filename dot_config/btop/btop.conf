#? Config file for btop v.1.4.8

color_theme = "tokyonight_storm"

theme_background = true

truecolor = true

force_tty = false

disable_presets = "Off"

# Presets: box:position:graph, separated by spaces.
presets = "cpu:1:default,proc:0:default cpu:0:default,mem:0:default,net:0:default cpu:0:block,net:0:tty"

vim_keys = true

disable_mouse = false

rounded_corners = true

terminal_sync = true

# Graphs: braille, block, or tty; per-box default inherits this.
graph_symbol = "block"

graph_symbol_cpu = "default"

graph_symbol_gpu = "default"

graph_symbol_mem = "default"

graph_symbol_net = "default"

graph_symbol_proc = "default"

shown_boxes = "cpu mem net proc gpu0"

# Update interval in milliseconds.
update_ms = 2400

proc_sorting = "cpu direct"

proc_reversed = false

proc_tree = false

proc_colors = true

proc_gradient = true

proc_per_core = true

proc_mem_bytes = true

proc_cpu_graphs = true

proc_info_smaps = false

proc_left = false

proc_filter_kernel = false

proc_follow_detailed = true

proc_aggregate = false

proc_tree_auto_collapse = 0

keep_dead_proc_usage = false

cpu_graph_upper = "Auto"

cpu_graph_lower = "gpu-vram-totals"

show_gpu_info = "On"

cpu_invert_lower = true

cpu_single_graph = false

cpu_bottom = false

show_uptime = true

show_cpu_watts = true

check_temp = true

cpu_sensor = "Auto"

show_coretemp = true

# Sensor overrides: core:sensor pairs.
