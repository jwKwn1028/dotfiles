#!/usr/bin/env bash
set -euo pipefail

config_file="$(mktemp)"
trap 'rm -f -- "$config_file"' EXIT
cat >"$config_file"

set_top_level() {
    local key="$1" value="$2"

    if sed -n '1,/^\[/p' "$config_file" | grep -Eq "^${key}[[:space:]]*="; then
        sed -i -E "1,/^\[/s|^${key}[[:space:]]*=.*$|${key} = \"${value}\"|" "$config_file"
    else
        sed -i "1i${key} = \"${value}\"" "$config_file"
    fi
}

set_top_level model_reasoning_effort xhigh
set_top_level model gpt-5.6-sol

# Everything else in config.toml -- MCP servers, hooks, plugin registration,
# per-project trust -- is installer- or Codex-owned and passes through
# untouched. See AGENTS.md, "Agent tooling this repo does not manage".
cat "$config_file"
