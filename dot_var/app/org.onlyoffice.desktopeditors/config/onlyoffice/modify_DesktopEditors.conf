#!/usr/bin/python3
"""Set titlebar=system: the custom frame's shadow shows as a margin in i3."""

import re
import sys

WANT = b"titlebar=system"
KEY = re.compile(rb"\s*titlebar\s*=")

data = sys.stdin.buffer.read()
lines = data.splitlines(keepends=True)
nl = b"\r\n" if b"\r\n" in data else b"\n"

section = None
general_at = None
for i, line in enumerate(lines):
    stripped = line.strip()
    if stripped.startswith(b"[") and stripped.endswith(b"]"):
        section = stripped[1:-1]
        if section == b"General":
            general_at = i
        continue
    if section == b"General" and KEY.match(line):
        lines[i] = WANT + (line[len(line.rstrip(b"\r\n")):] or nl)
        break
else:
    if general_at is not None:
        lines.insert(general_at + 1, WANT + nl)
    else:
        if lines and not lines[-1].endswith((b"\n", b"\r")):
            lines[-1] += nl
        lines = [b"[General]" + nl, WANT + nl] + ([nl] if lines else []) + lines

sys.stdout.buffer.write(b"".join(lines))
