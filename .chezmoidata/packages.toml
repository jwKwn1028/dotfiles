# Package manifest for the distro-specific run_once_* provisioning scripts.
# Edit these lists to add or remove software; chezmoi re-runs the installers
# when this file changes.
#
# apt names target Linux Mint 22.3 / Ubuntu 24.04.

[packages.apt]
# PPAs added before the apt install pass (needed for packages not in the
# default Mint/Ubuntu repos).
ppas = [
    "ppa:maveonair/helix-editor",   # helix editor
]

# Installed on every machine (CLI / dev tooling).
# NOTE: on Debian/Ubuntu, `fd-find` -> `fdfind` and `bat` -> `batcat`;
# the shell configs already alias these, so no extra symlinks are needed.
common = [
    "git", "git-lfs", "curl", "wget",
    "build-essential", "gcc", "make", "cmake", "pkg-config",
    "software-properties-common",
    "zsh", "tmux", "micro", "nano", "vim",
    "helix",
    "bat", "btop", "htop", "fastfetch",
    "fd-find", "fzf", "ripgrep", "jq", "tree",
    "unzip", "zip", "7zip", "p7zip-full", "bzip2", "gzip",
    "nodejs", "npm", "pipx",
    "ranger", "taskwarrior-tui",
    # AGENTS.md requires linting the run_once_* scripts before changing them,
    # so treat it as a dependency of working in this repo, not an optional tool.
    "shellcheck",
]

# Installed only for class == "desktop" and profile == "linuxmint-i3-x11".
i3_x11 = [
    "i3", "i3status", "polybar", "picom", "rofi", "dunst",
    "feh", "flameshot", "xdotool", "wmctrl", "xclip", "xsel",
    "zathura", "zathura-pdf-poppler",
    "thunar", "thunar-archive-plugin", "thunar-media-tags-plugin", "thunar-volman",
    "pavucontrol", "blueman", "brightnessctl", "playerctl",
    # nm-applet supplies the graphical wifi menu embedded by Polybar's tray.
    "network-manager-gnome",
    # i3ipc bindings for dot_config/i3/overflow-watcher.py, started from the i3
    # autostart. Without it the watcher dies on import and windows that land
    # too small are never handed to another workspace.
    "python3-i3ipc",
    # X bindings for dot_config/i3/top-edge-peek.py, also started from the i3
    # autostart. It polls the pointer to peek Polybar at the screen edge, and
    # without this it dies on import and the edge simply does nothing.
    "python3-xlib",
    "gimp", "vlc", "mpv",
    # Display manager + screen locker for a standalone i3 login session.
    # Installing lightdm may prompt you to pick the default display manager.
    "lightdm", "lightdm-settings", "light-locker",
]

[packages.flatpak]
# Installed only when class == "desktop", from Flathub.
apps = [
    "app.zen_browser.zen",
    "md.obsidian.Obsidian",
    "com.logseq.Logseq",
    "com.super_productivity.SuperProductivity",
    "org.inkscape.Inkscape",
    "org.kde.okular",
    "org.localsend.localsend_app",
    "org.onlyoffice.desktopeditors",
    "com.github.jeromerobert.pdfarranger",
    "com.github.wwmm.easyeffects",
    "org.prismlauncher.PrismLauncher",
]

[packages.cargo]
# Rust tools built from source, for crates the distro does not package.
#
# Every entry carries `bin`, the command the crate installs, which is often not
# the crate name (yazi-fm -> yazi, cargo-update -> cargo-install-update).
# Provisioning skips a crate whose `bin` is already on PATH, so a distro that
# packages one of these is not made to rebuild it from source.

# `cargo install --locked <crate>` from crates.io.
# eza = modern ls; the rest are Helix LSPs / formatters + utilities.
# yazi-fm/yazi-cli provide the `yazi` file manager used by the shell configs.
registry = [
    { crate = "eza",           bin = "eza" },
    { crate = "yazi-fm",       bin = "yazi" },
    { crate = "yazi-cli",      bin = "ya" },
    { crate = "dprint",        bin = "dprint" },
    { crate = "taplo-cli",     bin = "taplo" },
    { crate = "typstyle",      bin = "typstyle" },
    { crate = "texlab",        bin = "texlab" },
    { crate = "harper-ls",     bin = "harper-ls" },
    { crate = "watchexec-cli", bin = "watchexec" },
    { crate = "cargo-update",  bin = "cargo-install-update" },
]

# `cargo install --git <url> --locked` for crates not published to crates.io.
# Optional `package` names one crate inside a repo that contains several with
# binaries; cargo refuses to guess and aborts without it.
git = [
    # rtk (see RTK.md)
    { url = "https://github.com/rtk-ai/rtk",                     bin = "rtk" },
    # markdown LSP
    { url = "https://github.com/Feel-ix-343/markdown-oxide.git", bin = "markdown-oxide" },
    # typst LSP
    { url = "https://github.com/Myriad-Dreamin/tinymist",        bin = "tinymist", package = "tinymist-cli" },
    # tdf terminal PDF viewer
    { url = "https://github.com/itsjunetime/tdf.git",            bin = "tdf" },
]
