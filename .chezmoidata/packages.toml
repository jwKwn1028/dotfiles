fork_branch = "zathura"
build_deps = [
    "libmupdf-dev", "libharfbuzz-dev", "libfreetype-dev", "libjbig2dec0-dev",
    "libjpeg-dev", "libopenjp2-7-dev", "libgumbo-dev", "libmujs-dev", "zlib1g-dev",
]
