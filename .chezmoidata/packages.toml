# Package manifest for the distro-specific run_once_* provisioning scripts.
# Edit these lists to add or remove software; chezmoi re-runs the installers
# when this file changes. apt names target Linux Mint 22.3 / Ubuntu 24.04.

[packages.apt]
# PPAs added before the apt install pass, for packages not in the Mint repos.
ppas = [
    "ppa:maveonair/helix-editor",   # helix editor
]

# Installed on every machine (CLI / dev tooling).
# NOTE: Debian ships `fd-find`->`fdfind` and `bat`->`batcat`; the shell configs
# already alias these, so no extra symlinks are needed.
common = [
    "git", "git-lfs", "curl", "wget",
    "restic", "openssl",
    "build-essential", "gcc", "make", "cmake", "pkg-config",
    "software-properties-common",
    "zsh", "tmux", "micro", "nano", "vim",
    "helix",
    "bat", "btop", "htop", "fastfetch",
    "fd-find", "fzf", "ripgrep", "jq", "tree",
    "unzip", "zip", "7zip", "p7zip-full", "bzip2", "gzip",
    "nodejs", "npm", "pipx",
    "ranger",
    # Host half of the browserpass integration below; must not drift from it.
    "pass",
    # The TUI only -- `task` itself is deliberately absent: Ubuntu ships 2.6.2
    # (flat-file) but dot_taskrc targets 3.x (sqlite). Install task by hand.
    "taskwarrior-tui",
    # AGENTS.md requires linting the run_once_* scripts, so treat it as a
    # dependency of working in this repo, not an optional tool.
    "shellcheck",
]

# Battery-only, gated at runtime: neither class nor desktopProfile encodes "laptop".
laptop = [
    "tlp", "tlp-rdw",
]

# Installed only for class == "desktop" and profile == "linuxmint-i3-x11".
i3_x11 = [
    "i3", "i3status", "polybar", "picom", "rofi", "dunst",
    "feh", "flameshot", "xdotool", "wmctrl", "xclip", "xsel",
# Direct i3/Polybar runtime dependencies.
    "xfce4-terminal", "xfce4-settings", "xfce4-power-manager", "xfce4-taskmanager",
    "gnome-keyring", "libnotify-bin", "policykit-1-gnome",
    "x11-utils", "x11-xserver-utils", "xinput", "pulseaudio-utils",
    "zenity", "xss-lock", "unclutter-xfixes",
    "zathura", "zathura-pdf-poppler",
    "thunar", "thunar-archive-plugin", "thunar-media-tags-plugin", "thunar-volman",
    # ~/.local/bin/thunar shadows the XSETTINGS icon name onto Papirus-Dark;
    # without this the themed Thunar renders with missing icons.
    "papirus-icon-theme",
    "pavucontrol", "blueman", "brightnessctl", "playerctl", "thunderbird",
    # Browserpass host for Zen and Helium; after_60/after_70 wire the manifests.
    # Not i3-specific, but this is the only desktop-gated apt list.
    "webext-browserpass",
    "fcitx5", "fcitx5-hangul", "fcitx5-frontend-all", "fcitx5-config-qt",
    # nm-applet supplies the graphical wifi menu embedded by Polybar's tray.
    "network-manager-gnome",
    # i3ipc bindings for overflow-watcher.py; without it the watcher dies on
    # import and windows that land too small are never moved.
    "python3-i3ipc",
    # X bindings for top-edge-peek.py; without it the edge peek does nothing.
    "python3-xlib",
    # Mozilla's jsonlz4 envelope for browser session files. Keep it in the
    # distro Python used by the i3 helpers.
    "python3-lz4",
    "gimp", "vlc", "mpv",
    # Display manager + screen locker for a standalone i3 login session.
    # Installing lightdm may prompt you to pick the default display manager.
    "lightdm", "lightdm-settings", "light-locker",
]

[packages.flatpak]
# Installed only when class == "desktop", from Flathub.
apps = [
    "app.zen_browser.zen",
    "md.obsidian.Obsidian",
    "com.logseq.Logseq",
    "org.inkscape.Inkscape",
    "org.kde.okular",
    "org.localsend.localsend_app",
    "org.onlyoffice.desktopeditors",
    "com.github.jeromerobert.pdfarranger",
    "com.github.wwmm.easyeffects",
    "org.prismlauncher.PrismLauncher",
]

[packages.pipx]
# linuxmint-i3-x11 apps; bin is the idempotency check.
apps = [
    { package = "autotiling", bin = "autotiling" },
]

[packages.cargo]
# Rust tools built from source, for crates the distro does not package.
#
# Every entry carries `bin`, the command the crate installs, which is often not
# the crate name (yazi-fm -> yazi, cargo-update -> cargo-install-update).
# Provisioning skips a crate whose `bin` is already on PATH.

# `cargo install --locked <crate>` from crates.io. eza = modern ls; the rest are
# Helix LSPs / formatters plus utilities. yazi-fm/yazi-cli provide `yazi`.
registry = [
    { crate = "eza",           bin = "eza" },
    { crate = "yazi-fm",       bin = "yazi" },
    { crate = "yazi-cli",      bin = "ya" },
    { crate = "dprint",        bin = "dprint" },
    { crate = "taplo-cli",     bin = "taplo" },
    { crate = "typstyle",      bin = "typstyle" },
    { crate = "texlab",        bin = "texlab" },
    { crate = "harper-ls",     bin = "harper-ls" },
    { crate = "watchexec-cli", bin = "watchexec" },
    { crate = "cargo-update",  bin = "cargo-install-update" },
]

# `cargo install --git <url> --locked` for crates not on crates.io. Optional
# `package` names one crate in a multi-crate repo; cargo aborts without it.
git = [
    # rtk: CLI output filter, configured by dot_config/rtk/filters.toml.
    { url = "https://github.com/rtk-ai/rtk",                     bin = "rtk" },
    # markdown LSP
    { url = "https://github.com/Feel-ix-343/markdown-oxide.git", bin = "markdown-oxide" },
    # typst LSP
    { url = "https://github.com/Myriad-Dreamin/tinymist",        bin = "tinymist", package = "tinymist-cli" },
    # tdf terminal PDF viewer
    { url = "https://github.com/itsjunetime/tdf.git",            bin = "tdf" },
]
