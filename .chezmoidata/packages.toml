# Package manifest for the distro-specific run_once_* provisioning scripts.
# Edit these lists to add or remove software; chezmoi re-runs the installers
# when this file changes. apt names target Linux Mint 22.3 / Ubuntu 24.04.

[packages.apt]
# PPAs added before the apt install pass, for packages not in the Mint repos.
ppas = [
    "ppa:maveonair/helix-editor",   # helix editor
    "ppa:zhangsongcui3371/fastfetch",
]

# Installed on every machine (CLI / dev tooling).
# NOTE: Debian ships `fd-find`->`fdfind` and `bat`->`batcat`; the shell configs
# alias both. `~/.local/bin/fd` also links `fdfind`, since Yazi runs `fd` directly.
common = [
    "git", "git-lfs", "curl", "wget", "netcat-openbsd",
    "restic", "openssl",
    "build-essential", "gcc", "make", "cmake", "pkg-config",
    "software-properties-common",
    "zsh", "tmux", "micro", "nano", "vim",
    "helix",
    "bat", "btop", "htop", "fastfetch",
    "fd-find", "fzf", "ripgrep", "jq", "tree",
    "unzip", "zip", "7zip", "p7zip-full", "bzip2", "gzip",
    "nodejs", "pipx",
    "python3", "python3-tomlkit",
    "ranger",
    # Host half of the browserpass integration below; must not drift from it.
    "pass",
    # AGENTS.md requires linting the run_once_* scripts, so treat it as a
    # dependency of working in this repo, not an optional tool.
    "shellcheck",
]

# Installed for class == "desktop" on any profile.
desktop = [
    "flatpak",
    "librocm-smi64-1",
    # Browserpass host for Zen and Helium; after_60/after_70 wire the manifests.
    "webext-browserpass",
    # Pandoc PDF conversion.
    "pandoc", "latexmk", "texlive-xetex", "texlive-latex-extra",
    "texlive-fonts-recommended", "texlive-lang-chinese",
    "fontconfig", "fonts-noto-core", "fonts-noto-cjk",
]

# Battery-only, gated at runtime: neither class nor desktopProfile encodes "laptop".
laptop = [
    "tlp", "tlp-rdw",
]

# Installed only for class == "desktop" and profile == "linuxmint-i3-x11".
i3_x11 = [
    "i3", "i3status", "polybar", "picom", "rofi", "dunst",
    "util-linux",  # flock serializes i3 session saves/restores across profiles
    "feh", "flameshot", "xdotool", "wmctrl", "xclip", "xsel",
# Direct i3/Polybar runtime dependencies.
    "xfce4-terminal", "xfce4-settings", "xfce4-power-manager", "xfce4-taskmanager",
    "gnome-keyring", "libnotify-bin", "policykit-1-gnome",
    "x11-utils", "x11-xserver-utils", "xinput", "pulseaudio-utils",
    "zenity", "xss-lock", "i3lock", "unclutter-xfixes",
    "thunar", "thunar-archive-plugin", "thunar-media-tags-plugin", "thunar-volman",
    # GTK session icons.
    "papirus-icon-theme",
    # Theme artwork export.
    "python3-gi", "gir1.2-gdkpixbuf-2.0",
    "pavucontrol", "blueman", "brightnessctl", "playerctl", "thunderbird",
    "fcitx5", "fcitx5-hangul", "fcitx5-frontend-all", "fcitx5-config-qt",
    # nm-applet supplies the graphical wifi menu embedded by Polybar's tray.
    "network-manager-gnome",
    # i3ipc for the workspace-group controller and overflow-watcher.py; without
    # it workspace keys and overflow stop.
    "python3-i3ipc",
    # X bindings for top-edge-peek.py and restore placeholders; both fail
    # without it.
    "python3-xlib",
    # Mozilla's jsonlz4 envelope for browser session files. Keep it in the
    # distro Python used by the i3 helpers.
    "python3-lz4",
    "gimp", "vlc", "mpv",
    # Display manager for a standalone i3 login session; i3lock above is the
    # locker. Installing lightdm may prompt you to pick the default one.
    "lightdm", "lightdm-settings", "light-locker",
]

[packages.appimage.ghostty]
url = "https://github.com/pkgforge-dev/ghostty-appimage/releases/download"
version = "1.4.0"
legacy_ppa = "ppa:mkasberg/ghostty-ubuntu"
amd64 = { arch = "x86_64", sha256 = "50ad4f8b54a01e7d41426e7d12ffae9c88aa1c516ac140755e2bca596e1d2ae6" }
arm64 = { arch = "aarch64", sha256 = "932e21c671c215e6140633027acb4e8705cef3377d335202211c32d88b5bf506" }

[packages.fonts]
# Document fonts for after_50; specs are FAMILY=GLOB.
archives = [
    { directory = "NewComputerModern", url = "https://mirrors.ctan.org/fonts/newcomputermodern.zip", fonts = ["NewComputerModernSans10=NewCMSans10-*.otf", "NewComputerModernMath=NewCMMath-Regular.otf"] },
]

[packages.flatpak]
# Installed only when class == "desktop", from Flathub.
apps = [
    "app.zen_browser.zen",
    "org.inkscape.Inkscape",
    "org.kde.okular",
    "org.localsend.localsend_app",
    "org.onlyoffice.desktopeditors",
    "com.github.jeromerobert.pdfarranger",
    "com.github.wwmm.easyeffects",
    "org.prismlauncher.PrismLauncher",
]

[packages.pipx]
# linuxmint-i3-x11 apps; bin is the idempotency check.
apps = [
    { package = "autotiling", bin = "autotiling" },
    { package = "i3-resurrect==1.4.5", bin = "i3-resurrect" },
]

[packages.cargo]
# Rust tools built from source, for crates the distro does not package.
#
# Every entry carries `bin`, the command the crate installs, which is often not
# the crate name (yazi-fm -> yazi, cargo-update -> cargo-install-update).
# Provisioning skips a crate whose `bin` is already on PATH.

# `cargo install --locked <crate>` from crates.io. eza = modern ls; the rest are
# Helix LSPs / formatters plus utilities. yazi-fm/yazi-cli provide `yazi`;
# resvg renders its SVG previews.
registry = [
    { crate = "taskwarrior-tui", bin = "taskwarrior-tui" },
    { crate = "eza",           bin = "eza" },
    { crate = "yazi-fm",       bin = "yazi" },
    { crate = "yazi-cli",      bin = "ya" },
    { crate = "resvg",         bin = "resvg" },
    { crate = "dprint",        bin = "dprint" },
    { crate = "taplo-cli",     bin = "taplo" },
    { crate = "typstyle",      bin = "typstyle" },
    { crate = "typst-cli",     bin = "typst" },
    { crate = "texlab",        bin = "texlab" },
    { crate = "tex-fmt",       bin = "tex-fmt" },
    { crate = "watchexec-cli", bin = "watchexec" },
    { crate = "cargo-update",  bin = "cargo-install-update" },
]

# `cargo install --git <url> --locked` for crates not on crates.io. Optional
# `package` names one crate in a multi-crate repo; cargo aborts without it.
git = [
    # rtk: CLI output filter, configured by dot_config/rtk/filters.toml.
    { url = "https://github.com/rtk-ai/rtk",                     bin = "rtk" },
    # markdown LSP
    { url = "https://github.com/Feel-ix-343/markdown-oxide.git", bin = "markdown-oxide" },
    # typst LSP
    { url = "https://github.com/Myriad-Dreamin/tinymist",        bin = "tinymist", package = "tinymist-cli" },
    # tdf terminal PDF viewer
    { url = "https://github.com/itsjunetime/tdf.git",            bin = "tdf" },
]

# Pinned source builds. .chezmoiscripts/run_once_after_95-build-i3lock-color.sh.tmpl
# installs i3lock-color into /usr/local.
[packages.source.i3lock_color]
url = "https://github.com/Raymo111/i3lock-color.git"
tag = "2.13.c.5"
commit = "7b2badbb407ef5fce1eb338a98974ad5f70e226e"
build_deps = [
    "autoconf", "automake",
    "libcairo2-dev", "libev-dev", "libfontconfig-dev", "libjpeg-dev", "libpam0g-dev",
    "libxcb-composite0-dev", "libxcb-image0-dev", "libxcb-randr0-dev", "libxcb-util-dev",
    "libxcb-xinerama0-dev", "libxcb-xkb-dev", "libxcb-xrm-dev",
    "libxkbcommon-dev", "libxkbcommon-x11-dev",
]

# Built in this order into ~/.local by
# .chezmoiscripts/run_once_after_96-build-zathura.sh.tmpl; apt ships zathura 0.5.4.
[packages.source.girara]
url = "https://github.com/pwmt/girara.git"
tag = "0.4.5"
commit = "2aaf1d46e6c63e5eef64d58c4097f84c8d4ee20d"
build_deps = ["meson", "ninja-build", "gettext", "libgtk-3-dev", "libjson-glib-dev"]

[packages.source.zathura]
url = "https://github.com/pwmt/zathura.git"
tag = "0.5.14"
commit = "27c9acf39aa7608c7f69e985cddad7193820a6f3"
build_deps = [
    "libjson-glib-dev", "libmagic-dev", "libsqlite3-dev", "libsynctex-dev", "libseccomp-dev",
    "python3-sphinx",  # man pages
]

[packages.source.zathura_pdf_poppler]
url = "https://github.com/pwmt/zathura-pdf-poppler.git"
tag = "0.3.4"
commit = "9fc8752c76f9cc95419ab7b52a822b0f038b7859"
build_deps = ["libpoppler-glib-dev"]

[packages.source.btop]
url = "https://github.com/aristocratos/btop.git"
tag = "v1.4.8"
commit = "cf1da5900b1e9eaa1c20fd7148dd812b43340b8a"
build_deps = ["g++-14", "libdrm-dev", "lowdown"]

# fancy-cat (after_98): ~/fork_dir's fork_branch if present, else the commit.
[packages.source.fancy_cat]
url = "https://github.com/freref/fancy-cat.git"
version = "0.6.0"
commit = "77a7ab6c953e2a43e6e02bd7c341dc157d5da4a9"
